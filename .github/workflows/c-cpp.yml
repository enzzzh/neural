name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: compile 
      run: gcc -o neural neural.c -lm 
    - name: make sure shit is working 
      run: ./neural 0.8 0.001 
